<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3B82C4">
<title>Blutech 智能行政核決系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --accent:#3B82C4;--accent2:#2E6BA8;--accent-soft:rgba(59,130,196,.1);--accent-mid:rgba(59,130,196,.22);
  --ok:#2E9163;--ok-soft:#E9F7EF;--warn:#C07E1E;--warn-soft:#FDF3E3;--danger:#D94F4F;--danger-soft:#FCEBEB;
  --bg:#F3F5F8;--surface:#FFFFFF;--surface2:#F7F9FB;--surface3:#EEF2F6;
  --text:#101B27;--text2:#48586A;--text3:#8494A6;--text4:#C1CBD6;
  --border:#E1E7EE;--border2:#CBD5E0;
  --sb:#132234;--sb2:#0D1926;
  --r:10px;--rl:14px;--rxl:18px;--rpill:999px;
  --sh-sm:0 1px 3px rgba(16,27,39,.06),0 1px 2px rgba(16,27,39,.04);
  --sh-md:0 4px 14px rgba(16,27,39,.08);
  --sh-lg:0 12px 32px rgba(16,27,39,.14);
  --sans:'Noto Sans TC',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
a{color:inherit}

/* ── layout ── */
#appRoot{display:none;height:100vh}
#appRoot.show{display:flex}
aside{width:224px;min-width:224px;background:linear-gradient(180deg,var(--sb),var(--sb2));display:flex;flex-direction:column;color:#fff}
.brand{padding:20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-ic{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(59,130,196,.4)}
.brand-tx div:first-child{font-size:14px;font-weight:700}
.brand-tx div:last-child{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.05em}
.nav{flex:1;padding:10px;overflow-y:auto}
.nav-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:.1em;text-transform:uppercase;padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:rgba(255,255,255,.55);font-size:13.5px;cursor:pointer;margin-bottom:2px;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--accent-mid);color:#fff;font-weight:600}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
.user-card{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.user-row{display:flex;align-items:center;gap:9px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-info p{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.user-info span{font-size:10.5px;color:rgba(255,255,255,.4)}
.logout-btn{margin-left:auto;background:none;border:none;color:rgba(255,255,255,.4);padding:4px}
.logout-btn:hover{color:#fff}

main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:700}
.topbar p{font-size:11px;color:var(--text3)}
.content{flex:1;overflow-y:auto;padding:24px}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--rpill);font-size:13.5px;font-weight:600;border:none;background:var(--surface3);color:var(--text2);transition:.15s}
.btn:hover{background:#E4EAF1}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(59,130,196,.3)}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.danger:hover{background:#f8d7d7}
.btn.sm{padding:6px 13px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── card / panel ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px 20px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;cursor:pointer;transition:.15s}
.stat:hover{border-color:var(--accent);box-shadow:var(--sh-sm)}
.stat .n{font-size:26px;font-weight:700;line-height:1}
.stat .l{font-size:12px;color:var(--text3);margin-top:4px}

/* ── form ── */
.fr{margin-bottom:14px}
.flbl{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.fi{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;font-size:14px;color:var(--text);background:var(--surface);outline:none;transition:.15s}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.domain-input{display:flex}
.domain-input .fi{border-radius:10px 0 0 10px;border-right:none}
.domain-suffix{padding:0 12px;background:var(--surface3);border:1.5px solid var(--border);border-left:none;border-radius:0 10px 10px 0;font-size:13px;color:var(--text3);white-space:nowrap;display:flex;align-items:center}

/* ── table ── */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1.5px solid var(--border);background:var(--surface2)}
td{padding:11px 12px;border-bottom:1px solid var(--surface3);font-size:13.5px;vertical-align:middle}
tr.row-click{cursor:pointer}
tr.row-click:hover td{background:var(--surface2)}

/* ── badges ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:var(--rpill);font-size:11.5px;font-weight:600}
.b-draft{background:var(--surface3);color:var(--text2)}
.b-signing{background:var(--accent-soft);color:var(--accent2)}
.b-done{background:var(--ok-soft);color:var(--ok)}
.b-expired{background:var(--danger-soft);color:var(--danger)}
.chip-role{font-size:10.5px;padding:2px 8px;border-radius:var(--rpill);background:var(--surface3);color:var(--text2);white-space:nowrap}
.chip-role.approve{background:var(--danger-soft);color:#9a3f3f}
.chip-role.countersign{background:var(--accent-soft);color:var(--accent2)}
.chip-role.notify{background:var(--ok-soft);color:var(--ok)}

/* ── modal ── */
.ov{position:fixed;inset:0;background:rgba(10,18,28,.5);backdrop-filter:blur(3px);z-index:500;display:none;align-items:center;justify-content:center}
.ov.open{display:flex}
.modal{background:var(--surface);border-radius:var(--rxl);width:600px;max-width:94vw;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);display:flex;flex-direction:column}
.modal.wide{width:720px}
.m-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.m-head h3{font-size:15.5px;font-weight:700}
.m-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface3);color:var(--text3);font-size:18px;display:flex;align-items:center;justify-content:center}
.m-body{padding:20px 22px}
.m-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:var(--surface)}

/* ── signer chain card ── */
.chain-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--surface2)}
.chain-order{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chain-body{flex:1;min-width:0}
.chain-body select,.chain-body input{width:100%}
.chain-warn{font-size:11px;color:var(--warn);margin-top:3px}
.chain-remove{background:none;border:none;color:var(--text3);font-size:16px;padding:2px 6px;flex-shrink:0}
.chain-remove:hover{color:var(--danger)}

/* ── drawer ── */
#drawerOv{position:fixed;inset:0;background:rgba(10,18,28,.35);z-index:400;display:none}
#drawerOv.open{display:block}
#drawer{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:var(--surface);z-index:401;box-shadow:-8px 0 24px rgba(0,0,0,.12);transition:right .22s;overflow-y:auto}
#drawer.open{right:0}
.d-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--surface)}
.d-body{padding:18px 20px}
.d-sec{margin-bottom:20px}
.d-sec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.signer-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--surface3)}
.signer-row:last-child{border:none}
.signer-av{width:28px;height:28px;border-radius:50%;background:var(--surface3);color:var(--text2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.signer-av.done{background:var(--ok);color:#fff}
.signer-av.signing{background:var(--accent);color:#fff}

/* ── sign pad ── */
#signCanvas{border:1.5px solid var(--border);border-radius:10px;width:100%;height:160px;touch-action:none;background:var(--surface2);cursor:crosshair}
.sign-tabs{display:flex;gap:6px;margin-bottom:12px}
.sign-tab{flex:1;padding:8px;border-radius:var(--r);font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);text-align:center}
.sign-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sign-panel{display:none}
.sign-panel.active{display:block}
.type-preview{border:1.5px solid var(--border);border-radius:10px;padding:24px;text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-size:30px;color:var(--text);background:var(--surface2)}

/* ── toast ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:#fff;padding:10px 18px;border-radius:var(--rpill);font-size:13px;z-index:900;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── empty state ── */
.empty{text-align:center;padding:60px 20px;color:var(--text4)}
.empty svg{margin:0 auto 12px;opacity:.4}
.empty h4{font-size:14px;color:var(--text2);margin-bottom:4px}

/* ── login ── */
#loginPage{position:fixed;inset:0;background:linear-gradient(135deg,#EEF2F7,#E3E9F0);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-card{background:#fff;border-radius:20px;padding:32px;width:380px;box-shadow:0 24px 64px rgba(16,27,39,.14)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo .brand-ic{margin:0 auto 10px}
.login-logo h2{font-size:20px;font-weight:800;color:var(--text)}
.login-logo p{font-size:12.5px;color:var(--text3);margin-top:2px}
.login-err{font-size:12px;color:var(--danger);background:var(--danger-soft);padding:9px 12px;border-radius:8px;margin-bottom:12px;display:none}
.login-switch{text-align:center;margin-top:14px;font-size:12.5px;color:var(--accent);cursor:pointer}

@media(max-width:820px){
  aside{position:fixed;left:-224px;top:0;height:100vh;z-index:600;transition:left .2s}
  aside.open{left:0}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .modal,.modal.wide{width:96vw}
  #drawer{width:92vw;right:-92vw}
}
</style>
</head>
<body>

<!-- ══════════ 登入頁 ══════════ -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand-ic" style="width:48px;height:48px;border-radius:14px">
        <svg width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <h2>Blutech 核決系統</h2>
      <p id="loginModeSub">同仁登入</p>
    </div>

    <div class="fr">
      <label class="flbl">公司信箱</label>
      <div class="domain-input">
        <input class="fi" id="loginPrefix" placeholder="例：eric.chen" onkeydown="if(event.key==='Enter')document.getElementById('loginPwd').focus()">
        <span class="domain-suffix">@blutech.com.tw</span>
      </div>
    </div>
    <div class="fr" id="pwdFieldWrap">
      <label class="flbl">密碼</label>
      <input class="fi" id="loginPwd" type="password" placeholder="至少 6 個字元" onkeydown="if(event.key==='Enter')doLogin()">
      <div style="text-align:right;margin-top:6px">
        <a onclick="setLoginMode('forgot')" style="font-size:12px;color:var(--text3);cursor:pointer">忘記密碼？</a>
      </div>
    </div>

    <div id="signupFields" style="display:none">
      <div class="fr">
        <label class="flbl">姓名</label>
        <input class="fi" id="signupName" placeholder="例：陳大文">
      </div>
      <div class="fr">
        <label class="flbl">部門角色（決定核決矩陣中的身份）</label>
        <select class="fi" id="signupRole">
          <option value="一般成員">一般成員（僅參與簽署，不進核決矩陣）</option>
          <option value="Sales主管">Sales主管</option>
          <option value="CPM主管">CPM主管</option>
          <option value="FAAO主管">FAAO主管</option>
          <option value="CEO">CEO</option>
          <option value="管理員">管理員</option>
        </select>
      </div>
    </div>

    <p id="forgotHint" style="display:none;font-size:12.5px;color:var(--text3);margin-bottom:14px;line-height:1.6">輸入您的公司信箱，系統會寄一封重設密碼的連結信給您。</p>

    <p class="login-err" id="loginErr"></p>
    <p id="loginOk" style="font-size:12px;color:var(--ok);background:var(--ok-soft);padding:9px 12px;border-radius:8px;margin-bottom:12px;display:none"></p>

    <button class="btn primary" id="loginBtn" style="width:100%;justify-content:center;padding:11px" onclick="doLogin()">登入系統</button>
    <div class="login-switch" onclick="toggleSignupMode()" id="loginSwitchTxt">還沒有帳號？點此建立</div>
    <div class="login-switch" onclick="setLoginMode('login')" id="backToLoginTxt" style="display:none">← 返回登入</div>
  </div>
</div>

<!-- ══════════ 設定新密碼 Modal（從重設信連結點回來後顯示）══════════ -->
<div class="ov" id="resetPwOv">
  <div class="modal">
    <div class="m-head"><h3>設定新密碼</h3></div>
    <div class="m-body">
      <p style="font-size:12.5px;color:var(--text3);margin-bottom:14px">請設定您的新登入密碼。</p>
      <div class="fr"><label class="flbl">新密碼</label><input class="fi" id="newPwd1" type="password" placeholder="至少 6 個字元"></div>
      <div class="fr"><label class="flbl">確認新密碼</label><input class="fi" id="newPwd2" type="password" placeholder="再輸入一次"></div>
      <p class="login-err" id="resetPwErr"></p>
    </div>
    <div class="m-foot"><span></span><button class="btn primary" onclick="submitNewPassword()">儲存新密碼並登入</button></div>
  </div>
</div>


<!-- ══════════ 主系統 ══════════ -->
<div id="appRoot">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-ic">
        <svg width="17" height="17" fill="none" stroke="#fff" stroke-width="2.2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <div class="brand-tx"><div>Blutech</div><div>核決簽核系統</div></div>
    </div>
    <nav class="nav">
      <div class="nav-lbl">總覽</div>
      <div class="nav-item active" data-page="dash" onclick="goPage('dash')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>工作總覽
      </div>
      <div class="nav-item" data-page="tasks" onclick="goPage('tasks')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>簽核任務<span class="nav-badge" id="navBadge" style="display:none">0</span>
      </div>
      <div class="nav-lbl">參考</div>
      <div class="nav-item" data-page="matrix" onclick="goPage('matrix')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>核決矩陣
      </div>
      <div class="nav-item" data-page="members" onclick="goPage('members')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>同仁名冊
      </div>
      <div class="nav-lbl">帳號</div>
      <div class="nav-item" data-page="settings" onclick="goPage('settings')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>設定
      </div>
    </nav>
    <div class="user-card">
      <div class="user-row">
        <div class="avatar" id="meAvatar">--</div>
        <div class="user-info"><p id="meName">—</p><span id="meRole">—</span></div>
        <button class="logout-btn" onclick="doLogout()" title="登出">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div><h1 id="pgTitle">工作總覽</h1><p id="pgSub">Blutech Inc. 智能行政核決系統</p></div>
      <button class="btn primary" onclick="openLaunch()">

<script>

const SB_ANON_KEY = 'sb_publishable_ffb_8XYnFf1LQyUnJUJYCA_n5m1wL9I';
const sb = window.supabase.createClient(SB_URL, SB_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// ══════════════════════════════════════

let signingContext = null;  // { taskId, signerId }

// ══════════════════════════════════════

// ══════════════════════════════════════
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2800);
}
function fmtDate(d){
  if(!d) return '—';
  try{ return new Date(d).toLocaleString('zh-TW'); }catch(e){ return d; }
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function openModalEl(id){ document.getElementById(id).classList.add('open'); }

// ══════════════════════════════════════
// 登入 / 註冊
// ══════════════════════════════════════
function setLoginMode(mode){
  loginMode = mode;
  document.getElementById('loginErr').style.display = 'none';
  document.getElementById('loginOk').style.display = 'none';

  const sub = document.getElementById('loginModeSub');
  const pwdWrap = document.getElementById('pwdFieldWrap');
  const signupFields = document.getElementById('signupFields');
  const forgotHint = document.getElementById('forgotHint');
  const btn = document.getElementById('loginBtn');
  const switchTxt = document.getElementById('loginSwitchTxt');
  const backTxt = document.getElementById('backToLoginTxt');

  if(mode === 'signup'){
    sub.textContent = '建立新帳號';
    pwdWrap.style.display = 'block';
    signupFields.style.display = 'block';
    forgotHint.style.display = 'none';
    btn.textContent = '建立帳號並登入';
    switchTxt.style.display = 'block';
    switchTxt.textContent = '已經有帳號？點此登入';
    backTxt.style.display = 'none';
  } else if(mode === 'forgot'){
    sub.textContent = '重設密碼';
    pwdWrap.style.display = 'none';
    signupFields.style.display = 'none';
    forgotHint.style.display = 'block';
    btn.textContent = '寄送重設密碼信';
    switchTxt.style.display = 'none';
    backTxt.style.display = 'block';
  } else {
    sub.textContent = '同仁登入';
    pwdWrap.style.display = 'block';
    signupFields.style.display = 'none';
    forgotHint.style.display = 'none';
    btn.textContent = '登入系統';
    switchTxt.style.display = 'block';
    switchTxt.textContent = '還沒有帳號？點此建立';
    backTxt.style.display = 'none';
  }
}
function toggleSignupMode(){
  setLoginMode(loginMode === 'signup' ? 'login' : 'signup');
}
function showLoginErr(msg){
  const el = document.getElementById('loginErr');
  el.textContent = msg;
  el.style.display = 'block';
  const ok = document.getElementById('loginOk');
  if(ok) ok.style.display = 'none';
}
function mapAuthError(msg){
  if(/Invalid login credentials/i.test(msg)) return '帳號或密碼錯誤';
  if(/already registered/i.test(msg)) return '此帳號已註冊，請直接登入';
  if(/Password should be/i.test(msg)) return '密碼至少需要 6 個字元';
  if(/Unable to validate email/i.test(msg)) return '信箱格式不正確';
  return msg;
}
async function doLogin(){
  const prefix = document.getElementById('loginPrefix').value.trim();
  if(!prefix){ showLoginErr('請輸入公司帳號'); return; }
  const email = prefix.replace(/@.*$/,'') + '@blutech.com.tw';

  if(loginMode === 'forgot'){
    await doForgotPassword(email);
    return;
  }

  const pwd = document.getElementById('loginPwd').value;
  if(!pwd || pwd.length < 6){ showLoginErr('密碼至少需要 6 個字元'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = loginMode === 'signup' ? '建立中...' : '登入中...';
  document.getElementById('loginErr').style.display = 'none';

  try{
    if(loginMode === 'signup'){
      const name = document.getElementById('signupName').value.trim();
      const role = document.getElementById('signupRole').value;
      if(!name){ showLoginErr('請輸入姓名'); return; }
      const { error } = await sb.auth.signUp({ email, password: pwd, options:{ data:{ name, role } } });
      if(error) throw error;
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
      if(error) throw error;
    }
    await afterLogin();
  }catch(err){
    showLoginErr(mapAuthError(err.message||String(err)));
  }finally{
    btn.disabled = false;
    btn.textContent = loginMode === 'signup' ? '建立帳號並登入' : '登入系統';
  }
}
async function doForgotPassword(email){
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '寄送中...';
  document.getElementById('loginErr').style.display = 'none';
  document.getElementById('loginOk').style.display = 'none';
  try{
    const redirectTo = location.href.split('#')[0].split('?')[0];
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if(error) throw error;
    const ok = document.getElementById('loginOk');
    ok.textContent = '✅ 已寄出重設密碼信到 ' + email + '，請至信箱點擊連結設定新密碼。';
    ok.style.display = 'block';
  }catch(err){
    showLoginErr(mapAuthError(err.message||String(err)));
  }finally{
    btn.disabled = false;
    btn.textContent = '寄送重設密碼信';
  }
}
// 使用者從重設密碼信裡的連結點回來時，Supabase 會觸發這個事件
sb.auth.onAuthStateChange((event) => {
  if(event === 'PASSWORD_RECOVERY'){
    document.getElementById('loginPage').style.display = 'none';
    openModalEl('resetPwOv');
  }
});
async function submitNewPassword(){
  const p1 = document.getElementById('newPwd1').value;
  const p2 = document.getElementById('newPwd2').value;
  const err = document.getElementById('resetPwErr');
  err.style.display = 'none';
  if(!p1 || p1.length < 6){ err.textContent = '密碼至少需要 6 個字元'; err.style.display = 'block'; return; }
  if(p1 !== p2){ err.textContent = '兩次密碼輸入不一致'; err.style.display = 'block'; return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if(error){ err.textContent = mapAuthError(error.message); err.style.display = 'block'; return; }
  closeModal('resetPwOv');
  toast('✅ 密碼已更新');
  document.getElementById('loginPage').style.display = 'flex';
  await afterLogin();
}
async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}
async function afterLogin(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;

  let { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  // 保險：若觸發器來不及建立 profile，前端補建一次
  if(!profile){
    const meta = user.user_metadata || {};
    const { data: created } = await sb.from('profiles').insert({
      id: user.id, email: user.email,
      name: meta.name || user.email.split('@')[0],
      role: meta.role || '一般成員'
    }).select().single();
    profile = created;
  }

  me = { id: user.id, email: user.email, name: profile?.name || user.email, role: profile?.role || '一般成員' };

  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appRoot').classList.add('show');
  document.getElementById('meAvatar').textContent = me.name.slice(0,2);
  document.getElementById('meName').textContent = me.name;
  document.getElementById('meRole').textContent = me.role;

  await loadDirectory();
  await loadTasks();
  await loadMatrixData();
  populateTypeSelect();
  goPage('dash');
  subscribeRealtime();
  toast('☁️ 已登入，' + me.name + ' 您好');
}
async function restoreSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await afterLogin();
}

// ══════════════════════════════════════
// 資料讀取
// ══════════════════════════════════════
async function loadDirectory(){
  const { data, error } = await sb.from('profiles').select('*').order('name');
  if(error){ console.error(error); return; }
  directory = data || [];
}
async function loadMatrixData(){
  const { data, error } = await sb.from('matrix_types').select('*').order('sort_order');
  if(error){ console.error(error); return; }
  if(data && data.length){
    MATRIX_DATA = data.map(m => ({ code:m.code, name:m.name, note:m.note, seal:m.seal, chain: m.chain||[] }));
  }
}
function isAdmin(){
  return me && (me.role === '管理員' || me.role === 'CEO');
}
async function loadTasks(){
  const { data: taskRows, error: e1 } = await sb.from('tasks').select('*').order('created_at', { ascending:false });
  if(e1){ console.error(e1); toast('讀取任務失敗：' + e1.message); return; }
  const { data: signerRows, error: e2 } = await sb.from('task_signers').select('*').order('order_index');
  if(e2){ console.error(e2); return; }

  tasks = (taskRows||[]).map(t => ({
    id: t.id, name: t.name, type: t.type, typeCode: t.type_code,
    deadline: t.deadline, note: t.note, sealType: t.seal_type, status: t.status,
    createdBy: t.created_by_name, createdAt: t.created_at,
    signers: (signerRows||[]).filter(s => s.task_id === t.id).map(s => ({
      id: s.id, name: s.name, email: s.email, role: s.role, action: s.action,
      orderIndex: s.order_index, status: s.status, notify: s.notify,
      signatureType: s.signature_type, signatureData: s.signature_data, signedAt: s.signed_at
    }))
  }));
  updateNavBadge();
}
function updateNavBadge(){
  const cnt = tasks.filter(t => t.signers.some(s => s.status==='signing' && s.email===me.email)).length;
  const b = document.getElementById('navBadge');
  b.textContent = cnt;
  b.style.display = cnt>0 ? 'inline-flex' : 'none';
}
function subscribeRealtime(){
  sb.channel('app-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'tasks' }, async ()=>{ await loadTasks(); if(currentPage==='dash') renderDash(); if(currentPage==='tasks') renderTasks(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'task_signers' }, async ()=>{ await loadTasks(); if(currentPage==='dash') renderDash(); if(currentPage==='tasks') renderTasks(); if(drawerTaskId) openDrawer(drawerTaskId); })
    .on('postgres_changes', { event:'*', schema:'public', table:'matrix_types' }, async ()=>{ await loadMatrixData(); populateTypeSelect(); if(currentPage==='matrix') renderMatrixPage(); })
    .subscribe();
}

// ══════════════════════════════════════

const PAGE_META = {
  dash:{ title:'工作總覽', sub:'Blutech Inc. 智能行政核決系統' },
  tasks:{ title:'簽核任務', sub:'管理所有進行中的文件簽核流程' },
  matrix:{ title:'核決矩陣', sub:'各類文件的簽核層級對照表' },
  members:{ title:'同仁名冊', sub:'公司登入帳號與角色列表' },
  settings:{ title:'設定', sub:'個人資料、密碼與角色管理' },
};
function goPage(p){
  currentPage = p;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const navEl = document.querySelector(`.nav-item[data-page="${p}"]`);
  if(navEl) navEl.classList.add('active');
  document.getElementById('pgTitle').textContent = PAGE_META[p].title;
  document.getElementById('pgSub').textContent = PAGE_META[p].sub;
  if(p==='dash') renderDash();
  if(p==='tasks') renderTasks();
  if(p==='matrix') renderMatrixPage();

}

// ══════════════════════════════════════
// 工作總覽
// ══════════════════════════════════════
function renderDash(){
  const myTurn = tasks.filter(t => t.signers.some(s => s.status==='signing' && s.email===me.email));
  const inProgress = tasks.filter(t => t.status==='signing');
  const doneCnt = tasks.filter(t => t.status==='done').length;
  const overdue = tasks.filter(t => t.deadline && t.status!=='done' && new Date(t.deadline) < new Date()).length;

  const stats = [
    { n: myTurn.length, l: '待我簽署', c: 'var(--danger)' },
    { n: inProgress.length, l: '進行中任務', c: 'var(--accent)' },
    { n: overdue, l: '已逾期', c: 'var(--warn)' },
    { n: doneCnt, l: '累計完成', c: 'var(--ok)' },
  ];
  let html = '<div class="stat-grid">' + stats.map(s =>
    `<div class="stat"><div class="n" style="color:${s.c}">${s.n}</div><div class="l">${s.l}</div></div>`
  ).join('') + '</div>';

  html += '<div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:12px">待我處理的簽核</div>';
  if(!myTurn.length){
    html += '<div class="empty" style="padding:30px 0"><h4>目前沒有待簽項目</h4></div>';
  } else {
    html += myTurn.map(t => {
      const mySigner = t.signers.find(s=>s.status==='signing' && s.email===me.email);
      return `<div class="signer-row" style="cursor:pointer" onclick="openDrawer(${t.id})">
        <div class="signer-av signing">${ACTION_LABEL[mySigner.action]||''}</div>
        <div style="flex:1"><div style="font-weight:600;font-size:13.5px">${esc(t.name)}</div><div style="font-size:11.5px;color:var(--text3)">${esc(t.type)} · 截止 ${t.deadline||'未設定'}</div></div>
        <button class="btn primary sm" onclick="event.stopPropagation();openSignFromTask(${t.id})">立即簽署</button>
      </div>`;
    }).join('');
  }
  html += '</div>';

  html += '<div style="margin-top:20px"><div style="font-size:14px;font-weight:700;margin-bottom:12px">全公司簽核進度總覽</div>';
  if(!inProgress.length){
    html += '<div class="card"><div class="empty" style="padding:24px 0"><h4>目前沒有進行中的簽核任務</h4></div></div>';
  } else {
    html += '<div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>文件名稱</th><th>簽核進度</th></tr></thead><tbody>';
    html += inProgress.map(t => {
      const bn = bottleneckInfo(t);
      return `<tr class="row-click" onclick="openDrawer(${t.id})">

// ══════════════════════════════════════
// 簽核進度條 / 卡關提示 輔助函式
// ══════════════════════════════════════
function daysSince(dateStr){
  if(!dateStr) return 0;
  const d = new Date(dateStr).getTime();
  if(isNaN(d)) return 0;
  return Math.max(0, Math.floor((Date.now() - d) / 86400000));
}
function stepTrackHtml(t){
  if(!t.signers.length) return '<span style="font-size:12px;color:var(--text4)">尚未設定簽核人</span>';
  return '<div style="display:flex;align-items:center;gap:3px">' +
    t.signers.map((s,i) => {
      const bg = s.status==='done' ? 'var(--ok)' : s.status==='signing' ? 'var(--accent)' : 'var(--surface3)';
      const fg = s.status==='pending' ? 'var(--text3)' : '#fff';
      const pulse = s.status==='signing' ? 'box-shadow:0 0 0 3px var(--accent-soft)' : '';
      const dot = `<div title="${esc(s.name)}（${esc(s.role||'')}・${ACTION_LABEL[s.action]||''}）" style="width:20px;height:20px;border-radius:50%;background:${bg};color:${fg};font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;${pulse}">${s.status==='done'?'✓':(i+1)}</div>`;
      const line = i < t.signers.length-1 ? `<div style="width:14px;height:2px;background:${s.status==='done'?'var(--ok)':'var(--border)'};flex-shrink:0"></div>` : '';
      return dot + line;
    }).join('') + '</div>';
}
function bottleneckInfo(t){
  if(t.status === 'done') return { text: '✅ 已全部完成', color: 'var(--ok)' };
  if(t.status === 'expired') return { text: '⚠️ 已逾期失效', color: 'var(--danger)' };
  const cur = t.signers.find(s => s.status === 'signing');
  if(!cur) return { text: '—', color: 'var(--text3)' };
  const idx = t.signers.findIndex(s => s.id === cur.id);
  const startAt = idx > 0 ? t.signers[idx-1].signedAt : t.createdAt;
  const days = daysSince(startAt);
  const waitTxt = days > 0 ? `已卡 ${days} 天` : '今天剛輪到';
  return { text: `🔸 卡在 ${cur.name}（${ACTION_LABEL[cur.action]||''}）・${waitTxt}`, color: days >= 3 ? 'var(--danger)' : 'var(--text2)' };
}

      <div style="flex:1"><div style="font-weight:500">${esc(s.name)} <span class="chip-role ${s.action}">${ACTION_LABEL[s.action]||''}</span></div>
      <div style="font-size:11px;color:var(--text3)">${SIGNER_STATUS_LABEL[s.status]}${s.signedAt?(' · '+fmtDate(s.signedAt)):''}</div></div>
      ${canSign?`<button class="btn primary sm" onclick="openSignModal(${t.id},${s.id})">簽署</button>`:''}
    </div>`;
  }).join('');
  html += '</div>';

  document.getElementById('drBody').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOv').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOv').classList.remove('open');
  drawerTaskId = null;
}
function openSignFromTask(taskId){
  const t = tasks.find(x=>x.id===taskId);
  const s = t.signers.find(s=>s.status==='signing' && s.email===me.email);
  if(s) openSignModal(taskId, s.id);
}

// ══════════════════════════════════════
// 簽署 Modal（手寫 / 打字）
// ══════════════════════════════════════
function switchSignTab(tab){
  document.getElementById('tabDraw').classList.toggle('active', tab==='draw');
  document.getElementById('tabType').classList.toggle('active', tab==='type');
  document.getElementById('panelDraw').classList.toggle('active', tab==='draw');
  document.getElementById('panelType').classList.toggle('active', tab==='type');
  signingContext.tab = tab;
}
function openSignModal(taskId, signerId){
  const t = tasks.find(x=>x.id===taskId);
  const s = t.signers.find(x=>x.id===signerId);
  if(!s || s.email !== me.email){ toast('您沒有權限簽署此關卡'); return; }
  signingContext = { taskId, signerId, tab:'draw' };
  document.getElementById('signSub').textContent = t.name + '　·　身份：' + s.role + '（' + ACTION_LABEL[s.action] + '）';
  document.getElementById('typeSignInput').value = me.name;
  switchSignTab('draw');
  updateTypePreview();
  openModalEl('signOv');
  setTimeout(initCanvas, 60);
}
function initCanvas(){
  const cv = document.getElementById('signCanvas');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#101B27'; ctx.lineWidth=2.4;
  function pos(e){
    const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX-r.left, y: p.clientY-r.top };
  }
  function start(e){ e.preventDefault(); drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function end(){ drawing=false; }
  cv.onmousedown=start; cv.onmousemove=move; cv.onmouseup=end; cv.onmouseleave=end;
  cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
}
function clearCanvas(){
  const cv = document.getElementById('signCanvas');
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}
function updateTypePreview(){
  const v = document.getElementById('typeSignInput').value.trim() || '簽名預覽';
  document.getElementById('typePreview').textContent = v;
}
async function confirmSign(){
  if(!signingContext) return;
  const { taskId, signerId, tab } = signingContext;
  let sigType, sigData;
  if(tab==='draw'){
    const cv = document.getElementById('signCanvas');
    const blank = !cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data.some((v,i)=>i%4===3 && v>0);
    if(blank){ toast('請先手寫簽名'); return; }
    sigType='draw'; sigData = cv.toDataURL('image/png');
  } else {
    const v = document.getElementById('typeSignInput').value.trim();
    if(!v){ toast('請輸入簽名文字'); return; }
    sigType='type'; sigData = v;
  }

  const { error } = await sb.rpc('sign_task_signer', {
    p_signer_id: signerId, p_signature_type: sigType, p_signature_data: sigData
  });
  if(error){ toast('簽署失敗：' + error.message); return; }

  closeModal('signOv');
  await loadTasks();
  if(currentPage==='tasks') renderTasks();
  if(currentPage==='dash') renderDash();
  if(drawerTaskId) openDrawer(drawerTaskId);
  toast('✅ 簽署完成');
}

// ══════════════════════════════════════
// 初始化
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => { restoreSession(); });
</script>
